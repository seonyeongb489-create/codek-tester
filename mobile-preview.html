<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>mobile preview</title>
<style>
  html,body{margin:0;background:#d9d9db;font-family:system-ui,sans-serif}
  .stage{display:flex;gap:24px;padding:16px;align-items:flex-start}
  .phone{width:390px;height:844px;border:0;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
</style></head>
<body>
<div class="stage">
  <iframe class="phone" data-src="./index.html"></iframe>
  <iframe class="phone" data-src="./test.html"></iframe>
</div>
<script>
  var t = Date.now();
  document.querySelectorAll('iframe[data-src]').forEach(function(f){
    f.src = f.getAttribute('data-src') + '?t=' + t;
  });
</script>
</body></html>
